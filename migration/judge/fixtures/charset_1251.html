<!DOCTYPE html><html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1251"><title>Кодировка Страница</title></head><body><article id="content"><h1>Главный Заголовок Страницы</h1><p>Первый абзац текста на русском языке достаточно длинный для выборки.</p><p>Второй абзац текста тоже достаточно длинный для проверки декодирования.</p></article></body></html>
