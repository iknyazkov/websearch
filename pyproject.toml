[project]
name = "websearch"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    # httpx2, not httpx: 0.28.1's SOCKS transport applies NO deadline
    # during the socksio handshake — a silent socks5 peer hung a request
    # carrying an explicit per-request Timeout(8, connect=3) past 45 s
    # (probed 2026-10-30), the exact silent-infinite-hang shape the
    # bounded timeout exists to kill — while httpx2 2.16.0 raised
    # ReadTimeout at 8.1 s in the same probe. Redirect parity holds:
    # max_redirects=9 issues exactly 10 requests on an infinite 302
    # chain under httpx2 (probed), matching httpx 0.28 and Go.
    # [socks] = the socksio extra: Client construction raises ImportError
    # for socks5:// values without it. SOCKS_PROXY's scheme set is
    # socks5/socks5h only (enforced in network/client.py), so socksio
    # backs every configured proxy — a dependency, not an optional path.
    "httpx2[socks]>=2.16",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pytest>=8",
]

[project.scripts]
websearch = "websearch.main:main"

[tool.ruff.lint]
# A (flake8-builtins): §4 sanctions Go-verbatim names that shadow builtins
# only with an adjacent `# noqa: A002` — the rule must exist for the noqa
# to be meaningful. RUF100 flags stale noqas. BLE: the SDK-boundary broad
# except (inventory rows 85/91, Go's any-error → isError conversion) is a
# §3 suppression site (`# noqa: BLE001` + SAFETY line), not a global ignore.
select = ["E4", "E7", "E9", "F", "A", "RUF100", "BLE"]

[tool.ruff.lint.per-file-ignores]
# judge probe.py imports time mid-script deliberately (after the initialized
# notification, to drain it) — pre-existing under default select too; the
# judge is mutation-validated, so config-not-code is the zero-churn fix.
"migration/judge/probe.py" = ["E402"]

[tool.mypy]
strict = true
# migration/ is tooling (judge harness, depmap artifacts), not product code:
# ruff covers it; the strict gate applies to the port itself.
exclude = ["migration/"]

[tool.uv]
package = true
